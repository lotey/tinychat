<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匿名信道 | Anonymous Channel</title>
    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --bubble-me: #4f46e5;
            --text-me: #ffffff;
            --bubble-other: #f3f4f6;
            --text-other: #1f2937;
            --border-color: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        /* --- 核心容器：80% 宽度适配 --- */
        .app-wrapper {
            width: 80%;
            /* 电脑上占屏幕 80% */
            height: 90vh;
            /* 高度占 90% */
            min-width: 600px;
            /* 最小宽度保护，防止缩小窗口时太窄 */
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: width 0.3s ease;
            /* 窗口拖动时的平滑过渡 */
        }

        /* 顶部导航 */
        .navbar {
            height: 64px;
            padding: 0 30px;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444;
            transition: 0.3s;
        }

        .connection-dot.online {
            background-color: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }

        .online-pill {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-sub);
            background: #f9fafb;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 消息滚动区 */
        .chat-scroll-area {
            flex: 1;
            padding: 24px 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #fff;
        }

        /* 消息条目 */
        .msg-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 70%;
            /* 限制气泡最大宽度，太宽了阅读体验不好 */
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-item.me {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-item.other {
            align-self: flex-start;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #f3f4f6;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .msg-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .msg-item.me .msg-content-wrapper {
            align-items: flex-end;
        }

        .msg-item.other .msg-content-wrapper {
            align-items: flex-start;
        }

        .nickname {
            font-size: 12px;
            color: #9ca3af;
            margin: 0 2px;
        }

        /* 气泡 */
        .bubble {
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
        }

        .other .bubble {
            background: var(--bubble-other);
            color: var(--text-other);
            border-top-left-radius: 2px;
        }

        .me .bubble {
            background: var(--bubble-me);
            color: var(--text-me);
            border-top-right-radius: 2px;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }

        /* 底部输入区 */
        .input-toolbar {
            padding: 20px 30px;
            background: #fff;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            background: #f9fafb;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 16px;
            outline: none;
            resize: none;
            height: 56px;
            transition: 0.2s;
            font-family: inherit;
        }

        .input-field:focus {
            border-color: var(--primary);
            background: #fff;
        }

        .btn-send {
            height: 56px;
            padding: 0 28px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-send:hover {
            background: var(--primary-dark);
        }

        /* 图片按钮 */
        .btn-image {
            height: 56px;
            width: 56px;
            background: #f3f4f6;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-image:hover {
            background: #e5e7eb;
        }

        /* 图片消息样式 */
        .bubble img {
            max-width: 300px;
            max-height: 300px;
            border-radius: 8px;
            display: block;
            cursor: pointer;
            object-fit: contain;
        }

        /* 图片预览 */
        .image-preview {
            position: relative;
            display: inline-block;
            margin: 8px 0;
        }

        .image-preview img {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
        }

        .image-preview-close {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
        }

        /* --- 移动端强制 100% --- */
        @media (max-width: 768px) {
            .app-wrapper {
                width: 100%;
                height: 100vh;
                min-width: 0;
                border-radius: 0;
            }

            .navbar {
                padding: 0 16px;
            }

            .input-toolbar {
                padding: 12px 16px;
            }

            .msg-item {
                max-width: 88%;
            }

            /* 手机上气泡可以宽一点 */
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
</head>

<body>

    <div class="app-wrapper">
        <header class="navbar">
            <div class="nav-left">
                <div id="statusDot" class="connection-dot"></div>
                <div class="nav-title">Anonymous Hub</div>
            </div>
            <div class="nav-right">
                <div class="online-pill">
                    <span>🟢</span>
                    <span id="onlineCount">1</span> 在线
                </div>
            </div>
        </header>

        <main class="chat-scroll-area" id="msgContainer">
            <div style="text-align: center; color: #d1d5db; font-size: 13px; margin: 10px 0;">
                身份已随机化 · 通道建立 · 刷新页面自动清空记录
            </div>
        </main>

        <footer class="input-toolbar">
            <button class="btn-image" id="btnImage" title="发送图片">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </button>
            <input type="file" id="imageInput" accept="image/*" style="display:none">
            <div style="flex: 1; display: flex; flex-direction: column;">
                <div id="imagePreview" style="display: none;"></div>
                <textarea id="msgInput" class="input-field" placeholder="输入消息..." rows="1"></textarea>
            </div>
            <button class="btn-send" id="btnSend">发送</button>
        </footer>
    </div>

    <script>
        $(function () {
            // 定义 Protobuf schema
            const proto = `
        syntax = "proto3";
        package proto;
        
        enum MessageType {
            MESSAGE = 0;
            ONLINE_COUNT = 1;
            SYSTEM = 2;
            JOIN = 3;
            LEAVE = 4;
        }
        
        message ChatMessage {
            MessageType type = 1;
            string content = 2;
            int32 sender_id = 3;
            string sender_name = 4;
            int32 online_count = 5;
            int64 timestamp = 6;
            bytes image_data = 7;
            string image_mime = 8;
        }
    `;

            // 加载 Protobuf 定义
            protobuf.parse(proto, { keepCase: true }).root.lookupType("proto.ChatMessage");
            const ChatMessage = protobuf.parse(proto).root.lookupType("proto.ChatMessage");
            const MessageType = protobuf.parse(proto).root.lookupEnum("proto.MessageType").values;

            // 生成随机用户ID（数字）
            function generateUserId() {
                return Math.floor(Math.random() * 10000);
            }
            const myId = generateUserId();
            const myName = "U" + String(myId).padStart(4, '0');

            // 图片预览状态
            let pendingImage = null;

            // WebSocket 连接（根据页面协议自动选择 ws/wss）
            const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const WS_URL = `${wsProtocol}//${location.host}/ws`;
            let ws;

            // 连接 WebSocket
            function connect() {
                ws = new WebSocket(WS_URL);
                ws.binaryType = 'arraybuffer'; // 重要：设置为二进制模式

                ws.onopen = () => {
                    $('#statusDot').addClass('online');
                    console.log("已连接到服务器 (Protobuf 二进制通信)");

                    // 立即发送握手消息，告诉服务器我的ID
                    const handshake = ChatMessage.create({
                        type: MessageType.MESSAGE,
                        content: '',  // 空消息作为握手
                        senderId: myId,
                        senderName: myName
                    });
                    const buffer = ChatMessage.encode(handshake).finish();
                    ws.send(buffer);
                };

                ws.onclose = () => {
                    $('#statusDot').removeClass('online');
                    setTimeout(connect, 3000);
                };

                ws.onmessage = (event) => {
                    try {
                        // 解码 Protobuf 二进制消息
                        const buffer = new Uint8Array(event.data);
                        const message = ChatMessage.decode(buffer);

                        // protobuf.js 会将 snake_case 转换为 camelCase
                        if (message.type === MessageType.MESSAGE && message.senderId !== myId) {
                            appendMessage('other', message.content, message.senderName, message.imageData);
                        } else if (message.type === MessageType.ONLINE_COUNT) {
                            $('#onlineCount').text(message.onlineCount);
                        } else if (message.type === MessageType.JOIN || message.type === MessageType.LEAVE) {
                            appendSystemMessage(message.content);
                        }
                    } catch (e) {
                        console.error('Protobuf 解码失败:', e);
                    }
                };
            }

            // 自适应压缩图片 (循环压缩直到 50KB 以下)
            function compressImage(file, maxWidth = 600) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width, height = img.height;
                            if (width > maxWidth) {
                                height = (height * maxWidth) / width;
                                width = maxWidth;
                            }
                            canvas.width = width;
                            canvas.height = height;
                            canvas.getContext('2d').drawImage(img, 0, 0, width, height);

                            // 循环压缩直到 50KB 以下
                            let quality = 0.8;
                            const tryCompress = () => {
                                canvas.toBlob((blob) => {
                                    if (blob.size <= 50 * 1024 || quality <= 0.1) {
                                        resolve(blob);
                                    } else {
                                        quality -= 0.1;
                                        tryCompress();
                                    }
                                }, 'image/jpeg', quality);
                            };
                            tryCompress();
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            // 处理图片选择
            function handleImage(file) {
                if (!file || !file.type.startsWith('image/')) return;

                compressImage(file).then(blob => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        pendingImage = { data: new Uint8Array(e.target.result), mime: 'image/jpeg' };
                        $('#imagePreview').html(`<div class="image-preview"><img src="${URL.createObjectURL(blob)}"><button class="image-preview-close">✕</button></div>`).show();
                    };
                    reader.readAsArrayBuffer(blob);
                });
            }

            // 发送消息
            function sendMessage() {
                const text = $('#msgInput').val().trim();
                if (!text && !pendingImage) return;

                const message = ChatMessage.create({
                    type: MessageType.MESSAGE,
                    content: text,
                    senderId: myId,
                    senderName: myName,
                    imageData: pendingImage ? pendingImage.data : null,
                    imageMime: pendingImage ? pendingImage.mime : ''
                });

                if (ws && ws.readyState === WebSocket.OPEN) {
                    const buffer = ChatMessage.encode(message).finish();
                    ws.send(buffer);
                    appendMessage('me', text, myName, pendingImage ? pendingImage.data : null);
                    $('#msgInput').val('');
                    $('#imagePreview').hide().empty();
                    pendingImage = null;
                    $('#msgInput').focus();
                }
            }

            // 追加消息到界面
            function appendMessage(type, text, name, imageData) {
                const id = type === 'me' ? myId : name.replace('U', '');
                let hash = 0;
                for (let i = 0; i < id.length; i++) {
                    hash = id.charCodeAt(i) + ((hash << 5) - hash);
                }
                const hue = Math.abs(hash) % 360;
                const avatarBg = `linear-gradient(135deg, hsl(${hue}, 65%, 55%), hsl(${hue + 40}, 65%, 45%))`;

                let content = '';
                if (imageData && imageData.length > 0) {
                    const blob = new Blob([imageData], { type: 'image/jpeg' });
                    const url = URL.createObjectURL(blob);
                    content += `<img src="${url}" onclick="window.open('${url}')">`;
                }
                if (text) content += (imageData ? '<br>' : '') + $('<div>').text(text).html();

                const msgHtml = `
            <div class="msg-item ${type}">
                <div class="avatar" style="background: ${avatarBg}; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 11px;">${id}</div>
                <div class="msg-content-wrapper">
                    <span class="nickname">${type === 'me' ? '我' : name}</span>
                    <div class="bubble">${content}</div>
                </div>
            </div>
        `;
                $('#msgContainer').append(msgHtml);
                $('#msgContainer').scrollTop($('#msgContainer')[0].scrollHeight);
            }

            // 追加系统消息
            function appendSystemMessage(text) {
                const msgHtml = `
            <div style="text-align: center; color: #9ca3af; font-size: 13px; margin: 10px 0;">
                ${$('<div>').text(text).html()}
            </div>
        `;
                $('#msgContainer').append(msgHtml);
                $('#msgContainer').scrollTop($('#msgContainer')[0].scrollHeight);
            }

            // 绑定事件
            $('#btnSend').on('click', sendMessage);
            $('#btnImage').on('click', () => $('#imageInput').click());
            $('#imageInput').on('change', (e) => handleImage(e.target.files[0]));
            $(document).on('click', '.image-preview-close', () => {
                $('#imagePreview').hide().empty();
                pendingImage = null;
            });
            $('#msgInput').on('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // 粘贴图片
            $(document).on('paste', (e) => {
                const items = e.originalEvent.clipboardData.items;
                for (let item of items) {
                    if (item.type.indexOf('image') !== -1) {
                        handleImage(item.getAsFile());
                        break;
                    }
                }
            });

            // 拖拽图片
            $('#msgContainer, #msgInput').on('dragover', (e) => e.preventDefault());
            $('#msgContainer, #msgInput').on('drop', (e) => {
                e.preventDefault();
                const file = e.originalEvent.dataTransfer.files[0];
                if (file) handleImage(file);
            });

            connect();
        });
    </script>
</body>

</html>
